ding:11px 0;border-bottom:1px solid #d4bfa0}@media(max-width:650px){.shell{padding:9px}.logo strong{font-size:20px}.logo small{font-size:9px}.logomark{width:37px;height:37px}.ribbon h1{font-size:26px}.steps{width:100%;overflow:auto}.step{white-space:nowrap}.workspace{border-width:6px;min-height:680px}.board{min-height:800px}.boardtip{display:none}header{padding-bottom:12px}footer{flex-direction:column}}
</style></head><body><div class="shell"><header><div class="logo"><div class="logomark">✳</div><div><strong>Human or Robot?</strong><small>The word lab · English starters</small></div></div><button class="btn secondary" id="restart">↻ Restart</button></header><div class="ribbon"><div><h1 id="title">Match the cards.</h1><p id="desc">Ziehe zwei passende Karten zusammen. Klicke auf ein Paar, um es wieder zu lösen.</p></div><div class="steps" id="steps"></div></div><div class="workspace"><div class="board" id="board" aria-label="Frei beweglicher Spieltisch"></div></div><div class="bottom"><button class="btn" id="check">✓ Check</button><span class="counter" id="counter"></span><div class="fill"></div><span class="result" id="result" role="status" aria-live="polite"></span><button class="btn" id="next" style="display:none">Next →</button></div><footer><span>EN <i class="rule" style="background:#d9f2eb"></i> English &nbsp; DE <i class="rule" style="background:#ffe9c8"></i> Deutsch</span><span id="save">LearningView · bereit zur Einbettung</span></footer></div><script>
'use strict';
const DATA=[
 [['skin','Haut'],['hair','Haare'],['blood','Blut'],['heart','Herz'],['brain','Gehirn'],['feelings','Gefühle'],['food','Essen'],['water','Wasser'],['eat','essen'],['drink','trinken'],['sleep','schlafen'],['grow','wachsen'],['cry','weinen'],['dream','träumen'],['feel pain','Schmerzen spüren']],
 [['head','Kopf'],['arms','Arme'],['hands','Hände'],['legs','Beine'],['feet','Füsse'],['eyes','Augen'],['voice','Stimme'],['body','Körper'],['walk','gehen'],['run','rennen'],['jump','springen'],['dance','tanzen'],['talk','sprechen'],['listen','zuhören'],['see','sehen'],['carry','tragen']],
 [['battery','Akku'],['motor','Motor'],['wires','Kabel'],['computer','Computer'],['camera','Kamera'],['sensor','Sensor'],['metal','Metall'],['software','Software'],['charge','aufladen'],['scan','scannen'],['calculate','berechnen'],['record','aufnehmen'],['restart','neu starten'],['update','aktualisieren'],['switch on','einschalten'],['switch off','ausschalten']]
];
const words=DATA.flatMap((list,g)=>list.map(([en,de],j)=>({id:`${g}_${j}`,en,de,g})));let stage=0, cards=[], pairs=new Map(), checked=false, errors=null, completed=false, active=null, z=10, lvMode=window.learningView?.mode||'student',lvLive=false, savePending=false,saveQueued=false,saveTimer=null,loaded=false;
const $=s=>document.querySelector(s), board=$('#board');const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const sendLV=payload=>{if(window.parent!==window)window.parent.postMessage(payload,'https://learningview.org')};
window.addEventListener('message',event=>{if(event.source!==window.parent||event.origin!=='https://learningview.org')return;lvLive=true;let d=event.data;
 if(d?.type==='sendEmbedContext'){lvMode=d.mode||lvMode;if(lvMode==='class')classView();else if(lvMode==='studentReview')$('#save').textContent='Nur Ansicht · LearningView';else if(!loaded&&lvMode==='student')sendLV({type:'getAnswerData'});return}
 if(d?.type==='sendAnswerData'&&!loaded){loaded=true;if(d.data){try{const obj=JSON.parse(d.data);if(obj.v===2&&obj.stage>=0&&obj.stage<=4){stage=obj.stage;completed=!!obj.completed;}}catch{}}init();return}
 if(d==='SAVED'){savePending=false;$('#save').textContent='In LearningView gespeichert';if(saveQueued){saveQueued=false;queueSave()}}
 if(d?.type==='saveAnswerDataError'){savePending=false;$('#save').textContent='Speichern fehlgeschlagen';saveQueued=false}
 if(d?.type==='sendClassAnswerData'&&lvMode==='class')renderClass(d);
});
function queueSave(){if(!lvLive||lvMode!=='student')return;if(savePending){saveQueued=true;return}clearTimeout(saveTimer);saveTimer=setTimeout(()=>{savePending=true;$('#save').textContent='Speichere Lernstand …';sendLV({type:'saveAnswerData',data:JSON.stringify({v:2,stage,completed})})},180)}
function init(){active=null;checked=false;errors=null;pairs.clear();cards=[];z=10;$('#steps').innerHTML=['Human','Both','Robot','Venn'].map((n,i)=>`<span class="step ${i===stage?'now':i<stage?'done':''}">${i<stage?'✓ ':''}${n}</span>`).join('');$('#check').style.display=stage===4?'none':'';$('#next').style.display='none';$('#result').textContent='';$('#result').className='result';
 if(stage===4){successScreen();return}$('#title').textContent=stage===3?'The final challenge.':'Match the cards.';$('#desc').textContent=stage===3?'Sortiere alle englischen Wörter ins Venn-Diagramm: Humans, Both oder Robots.':'Alle Karten sind beweglich. Schiebe die passenden Wörter zusammen. Ein Klick löst ein Paar.';
 if(stage<3)buildPairs();else buildVenn();refresh();}
function refresh(){if(stage===4)return;const complete=stage===3?cards.filter(c=>c.zone!==null).length:2*pairs.size;$('#counter').textContent=stage===3?`${complete} / 47 cards sorted`:`${pairs.size} / ${DATA[stage].length} pairs`;}
function shuffledGrid(items,cols,startY,cellW,cellH,width,jitter=8){let slots=shuffle(Array.from({length:items.length},(_,i)=>i));return items.map((item,index)=>{let s=slots[index],col=s%cols,row=Math.floor(s/cols);return {...item,x:35+col*cellW+(Math.random()-.5)*jitter,y:startY+row*cellH+(Math.random()-.5)*jitter,w:width,h:40,partner:null,zone:null}})}
function buildPairs(){board.className='board';board.style.height='820px';board.innerHTML='<div class="boardhead"><span class="stamp">WORD LAB / ROUND '+(stage+1)+'</span><span class="boardtip">↔ Match English and German cards</span></div>';let entries=shuffle(words.filter(w=>w.g===stage).flatMap(w=>[{key:w.id+'-en',word:w,lang:'en',label:w.en},{key:w.id+'-de',word:w,lang:'de',label:w.de}]));cards=shuffledGrid(entries,6,112,165,122,142,15);cards.forEach(makeCard)}
function makeCard(c){let el=document.createElement('div');el.className='card '+(c.lang||'venn-card');el.dataset.key=c.key;el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',c.lang?`${c.lang==='en'?'Englisch':'Deutsch'}: ${c.label}`:`${c.label}, verschieben`);el.innerHTML=c.lang?`<span class="flag">${c.lang.toUpperCase()}</span>`:'';el.append(document.createTextNode(c.label));c.el=el;position(c);board.append(el);el.addEventListener('pointerdown',e=>down(e,c));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(c.partner)unlink(c);}})}
function position(c){c.x=clamp(c.x,4,board.clientWidth-c.w-4);c.y=clamp(c.y,4,board.offsetHeight-c.h-4);c.el.style.width=c.w+'px';c.el.style.height=c.h+'px';c.el.style.transform=`translate(${c.x}px,${c.y}px)`;c.el.style.zIndex=String(c.z||4)}
function moveCard(c,x,y){c.x=clamp(x,4,board.clientWidth-c.w-4);c.y=clamp(y,4,board.offsetHeight-c.h-4);position(c)}
function unlink(c){if(!c.partner)return;let other=c.partner;c.partner=null;other.partner=null;pairs.delete(c.word.id);c.el.classList.remove('linked');other.el.classList.remove('linked');c.el.style.zIndex=String(++z);other.el.style.zIndex=String(++z);moveCard(c,c.x+(c.lang==='de'?8:-8),c.y+8);checked=false;errors=null;updateFeedback();refresh()}
function pair(a,b){if(a.partner||b.partner)return;if(a.lang===b.lang)return;let left=a.lang==='en'?a:b,right=a.lang==='de'?a:b;const total=left.w+right.w-2;let x=clamp((a.x+b.x)/2-total/2,5,board.clientWidth-total-5),y=clamp((a.y+b.y)/2,5,board.offsetHeight-left.h-5);left.partner=right;right.partner=left;pairs.set(left.word.id,[left,right]);moveCard(left,x,y);moveCard(right,x+left.w-2,y);left.el.classList.add('linked');right.el.classList.add('linked');left.el.style.zIndex=String(++z);right.el.style.zIndex=String(z);checked=false;errors=null;updateFeedback();refresh()}
function overlaps(a,b){let ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;return Math.abs(ax-bx)<(a.w+b.w)/2+32&&Math.abs(ay-by)<(a.h+b.h)/2+16}
function down(e,c){if(e.button!==0||stage===4||lvMode==='studentReview'||lvMode==='class')return;e.preventDefault();c.el.setPointerCapture(e.pointerId);let origin={x:e.clientX,y:e.clientY},loc={x:c.x,y:c.y},partnerLoc=c.partner?{x:c.partner.x,y:c.partner.y}:null,moved=false;const sc=board.getBoundingClientRect();const self=c.el;
 function onMove(ev){if(ev.pointerId!==e.pointerId)return;let dx=ev.clientX-origin.x,dy=ev.clientY-origin.y;if(Math.hypot(dx,dy)>5)moved=true;if(!moved)return;self.classList.add('dragging');self.style.zIndex=String(++z);moveCard(c,loc.x+dx,loc.y+dy);if(c.partner){c.partner.el.style.zIndex=String(z);moveCard(c.partner,partnerLoc.x+dx,partnerLoc.y+dy)}}
 function onUp(ev){if(ev.pointerId!==e.pointerId)return;self.removeEventListener('pointermove',onMove);self.removeEventListener('pointerup',onUp);self.removeEventListener('pointercancel',onCancel);self.classList.remove('dragging');if(!moved){if(c.partner)unlink(c);return}if(stage===3){const x=c.x+c.w/2,y=c.y+c.h/2;let zone=zoneAt(x,y);if(zone!==null){c.zone=zone;autoVennPosition(c,zone)}else if(y>675)c.zone=null;checked=false;errors=null;updateFeedback();refresh();return}if(c.partner){checked=false;errors=null;updateFeedback();return}let candidates=cards.filter(d=>d!==c&&!d.partner&&d.lang!==c.lang&&overlaps(c,d));if(candidates.length){let d=candidates.sort((a,b)=>Math.hypot(a.x-c.x,a.y-c.y)-Math.hypot(b.x-c.x,b.y-c.y))[0];pair(c,d)}else {checked=false;errors=null;updateFeedback()}}
 function onCancel(){self.removeEventListener('pointermove',onMove);self.removeEventListener('pointerup',onUp);self.removeEventListener('pointercancel',onCancel);self.classList.remove('dragging')};self.addEventListener('pointermove',onMove);self.addEventListener('pointerup',onUp);self.addEventListener('pointercancel',onCancel)}
function updateFeedback(){const result=$('#result');result.className='result';result.textContent=errors===null?'':errors===0?'✓ 0 errors. Great job!':`${errors} ${errors===1?'error':'errors'}. Try again.`;result.classList.toggle('ok',errors===0);result.classList.toggle('bad',errors>0);$('#next').style.display=errors===0?'':'none'}
function check(){let mistakes=0;if(stage<3){mistakes=DATA[stage].length-pairs.size;for(const [id,[a,b]] of pairs)if(a.word.id!==b.word.id)mistakes++}else if(stage===3){for(const c of cards)if(c.zone!==c.word.g)mistakes++}else return;errors=mistakes;checked=true;updateFeedback()}
function zoneAt(x,y){if(y<76||y>650||x<65||x>925)return null;let px=x-65,py=y-76,insideL=Math.hypot(px-287.5,py-287.5)<285,insideR=Math.hypot(px-562.5,py-287.5)<285;if(insideL&&insideR)return 1;if(insideL)return 0;if(insideR)return 2;return null}
function autoVennPosition(c,zone){let count=cards.filter(d=>d!==c&&d.zone===zone).length;let centers={0:[230,310],1:[495,315],2:[765,310]};let width=zone===1?160:188,columns=zone===1?2:2,rows=8;let col=count%columns,row=Math.floor(count/columns);c.w=zone===1?91:105;c.h=29;c.el.classList.remove('h','b','r');c.el.classList.add(['h','b','r'][zone]);let cx=centers[zone][0],cy=centers[zone][1];moveCard(c,cx-width/2+col*(c.w+5),cy-135+row*36);c.el.style.zIndex=String(++z)}
function buildVenn(){board.className='board venn-board';board.style.height='1370px';board.innerHTML='<div class="boardhead"><span class="stamp">FINAL CHALLENGE / 47 WORDS</span><span class="boardtip">Place every word in the right part of the Venn diagram</span></div><div class="venn"><div class="circle human"></div><div class="circle robot"></div><span class="zone-title h">Humans</span><span class="zone-title b">Both</span><span class="zone-title r">Robots</span></div><div class="venn-side"><strong>Where does it belong?</strong>Move every word into one of the three areas. The middle is for both humans and robots.</div><div class="venn-separator"></div><div class="venn-pool-guide">UNSORTED WORDS · DRAG TO THE DIAGRAM ↑</div>';
 let entries=shuffle(words.map(w=>({key:w.id,word:w,lang:null,label:w.en})));cards=shuffledGrid(entries,8,733,150,91,128,8);cards.forEach(c=>{c.h=34;makeCard(c)})}
function successScreen(){board.className='board';board.style.height='690px';board.innerHTML='<div class="finish"><div class="medal">🏅</div><h2>Well done!</h2><p>You matched all the words and finished the Venn diagram. <strong>47 / 47 correct.</strong></p><button class="btn" id="again">Play again ↻</button><div class="notice" id="lvEnd">Result: 100% · LearningView</div></div>';$('#again').addEventListener('click',restart);$('#counter').textContent='4 / 4 stages finished';$('#result').className='result ok';$('#result').textContent='✓ Completed';}
function next(){if(errors!==0)return;if(stage===3){stage=4;completed=true;sendLV({result:{score:{scaled:1}}});}else stage++;queueSave();init()}
function restart(){stage=0;completed=false;queueSave();init()}
function classView(){board.className='board';board.style.height='680px';board.innerHTML='<div class="review"><h2>LearningView · Klassenübersicht</h2><p>Lade die Lernstände …</p></div>';$('#check').style.display='none';$('#next').style.display='none';sendLV({type:'getClassAnswerData'})}
function renderClass(d){let div=board.querySelector('.review');if(!div)return;div.replaceChildren();let title=document.createElement('h2');title.textContent='Lernstände der Klasse';div.append(title);if(d.error){let msg=document.createElement('p');msg.textContent='Klassendaten nicht verfügbar.';div.append(msg);return}for(let s of d.data||[]){let row=document.createElement('div');row.className='student';let saved;try{saved=JSON.parse(s.data)}catch{}row.textContent=`${s.name||''} ${s.surname||''} – ${saved?.completed?'Abgeschlossen ✓':saved?.stage>=0?'Runde '+(Math.min(saved.stage+1,4)):'Noch nicht begonnen'}`;div.append(row)}}
$('#check').addEventListener('click',check);$('#next').addEventListener('click',next);$('#restart').addEventListener('click',restart);
window.addEventListener('resize',()=>{if(stage<4)for(const c of cards)position(c)});
if(window.parent!==window){sendLV({type:'setDialogSize',size:'max'});sendLV({type:'getEmbedContext'});if(lvMode==='class'){classView()}else if(lvMode==='student'||lvMode==='studentReview'){sendLV({type:'getAnswerData'});setTimeout(()=>{if(!loaded)init()},600)}else init()}else init();
</script></body></html>
